name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias (incluye DeepChecks)
        run: 'python -m pip install --only-binary=:all: -r requirements-validation.txt'
      - name: Revisar código
        run: python -m flake8 mibici tests
      - name: Ejecutar pruebas con datos sintéticos
        run: python -m pytest -v
      - name: Construir documentación sin advertencias
        run: python -m mkdocs build --strict -f docs/mkdocs.yml
  security:
    name: Seguridad / dependencias y código
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: 'python -m pip install --only-binary=:all: -r requirements-validation.txt'
      - name: Revisar secretos, datos privados e historial
        run: python -m mibici.security --history --output reports/security/repositorio.json
      # Vulnerabilidades revisadas que no aplican (ver docs/docs/verificacion.md):
      # setuptools 80.10.2: fijado por deepchecks; afecta sdist y wheels antiguos, no usados.
      - name: Auditar dependencias instaladas
        run: >-
          python -m pip_audit --skip-editable --progress-spinner off
          --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-xmj3-9gf7-h52w
      - name: Analizar código con bandit (severidad media o alta)
        run: python -m bandit -c pyproject.toml -r mibici -ll
  compose:
    name: Imagen y despliegue de prueba / Compose
    needs: [quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: mibici-ci
      MIBICI_IMAGE: mibici-api:ci
      MIBICI_MODEL_BUNDLE: ./models/ci-serving
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar cliente de verificación
        run: 'python -m pip install --only-binary=:all: -r requirements-api.txt'
      - name: Preparar modelos sintéticos exclusivos para la prueba de CI
        run: python -m tests.compose_seed --directory models/ci-serving
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Construir imagen con caché
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: Containerfile
          load: true
          tags: mibici-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validar configuración y desplegar servicios
        run: |
          docker compose config --quiet
          docker compose up --no-build -d --wait --wait-timeout 240
      - name: Verificar predicciones P1/P2 y rechazos de entradas inválidas
        run: python -m mibici.verify_api --output reports/compose/ci/http.json
      - name: Comprobar persistencia al recrear servicios
        run: |
          docker compose down
          docker compose up --no-build -d --wait --wait-timeout 240
          python -m mibici.verify_api --output reports/compose/ci/http-restart.json
      - name: Recopilar diagnósticos
        if: always()
        run: |
          mkdir -p reports/compose/ci
          docker compose ps --all --format json > reports/compose/ci/services.json
          docker compose logs --no-color > reports/compose/ci/logs.txt
      - name: Conservar evidencia de ejecución
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/compose/ci/
          retention-days: 14
      - name: Liberar recursos del runner
        if: always()
        run: docker compose down --volumes --remove-orphans
