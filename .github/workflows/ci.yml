name: CI
on:
  pull_request:
  push:
    branches:
      - main
      - feat/integracion-registry
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Python 3.13 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MLFLOW_DISABLE_AGENT_HINT: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias (incluye DeepChecks)
        run: python -m pip install -r requirements-validation.txt
      - name: Revisar código
        run: python -m flake8 mibici tests
      - name: Ejecutar pruebas con datos sintéticos
        run: python -m pytest -v
      - name: Construir documentación sin advertencias
        run: python -m mkdocs build --strict -f docs/mkdocs.yml
  security:
    name: Seguridad / dependencias y código
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.15'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-validation.txt
      # Vulnerabilidades revisadas que no aplican (ver docs/docs/verificacion.md):
      # mlflow 3.16.1: servidor de tracking y crewai, que el proyecto no expone ni usa.
      # setuptools 80.10.2: fijado por deepchecks; afecta sdist y wheels antiguos, no usados.
      - name: Auditar dependencias instaladas
        run: >-
          python -m pip_audit --skip-editable --progress-spinner off
          --ignore-vuln CVE-2026-53995 --ignore-vuln CVE-2026-115886
          --ignore-vuln CVE-2026-116691 --ignore-vuln PYSEC-2026-3447
          --ignore-vuln GHSA-xmj3-9gf7-h52w
      - name: Analizar código con bandit (severidad media o alta)
        run: python -m bandit -c pyproject.toml -r mibici -ll
