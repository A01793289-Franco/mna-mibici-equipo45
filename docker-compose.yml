name: mibici-equipo45

x-runtime: &runtime
  image: ${MIBICI_IMAGE:-mibici-api:local}
  build:
    context: .
    dockerfile: Containerfile
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=536870912,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [serving]
  environment: &environment
    OMP_NUM_THREADS: '2'
    OPENBLAS_NUM_THREADS: '2'
    MLFLOW_DISABLE_AGENT_HINT: '1'
    MLFLOW_TRACKING_URI: http://mlflow:5000
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  mlflow:
    <<: *runtime
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////state/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/state/artifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*
    environment:
      <<: *environment
      MLFLOW_TRACKING_URI: sqlite:////state/mlflow.db
    ports:
      - 127.0.0.1:${MLFLOW_PORT:-5000}:5000
    volumes:
      - registry:/state
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  registry-init:
    <<: *runtime
    command: [python, -m, mibici.registry_bundle, import, --directory, /models]
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${MIBICI_MODEL_BUNDLE:-./models/serving}
        target: /models
        read_only: true
        bind:
          create_host_path: false
    cpus: 1.0
    mem_limit: 1g
    restart: 'no'

  api:
    <<: *runtime
    depends_on:
      mlflow:
        condition: service_healthy
      registry-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:${API_PORT:-8000}:8000
    cpus: 2.0
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

networks:
  serving:

volumes:
  registry:
